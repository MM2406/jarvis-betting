name: soccer-live

on:
  schedule:
    # Startet stündlich von 12:00 bis 23:00 Uhr MEZ (11:00 bis 22:00 UTC)
    - cron: '0 11-22 * * *'
  workflow_dispatch:

concurrency:
  group: soccer-live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-soccer-board:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Soccer-Live-Update mit Präzisions-Loop ausführen
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_SOCCER: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
          TELEGRAM_SOCCER_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: python soccer_live.py

      - name: State committen und pushen
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_soccer.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Änderungen zu committen."
          else
            git commit -m "Update Soccer Live Board Final State [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
