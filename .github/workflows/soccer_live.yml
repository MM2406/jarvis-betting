name: JARVIS Soccer Live Tracker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-soccer-live]

jobs:
  track-soccer:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 1. Sicherheits-Check: Blockiert sofort bei ungültigen/halluzinierten Daten
      - name: Sanity Check gegen Falschdaten & Player Props
        run: |
          python validate_soccer_ticket.py

      # 2. Live-Aktualisierung (nur wenn Check oben erfolgreich)
      - name: Soccer Live-Update ausführen
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_SOCCER: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: |
          python soccer_live.py

      # 3. Aktualisierten State speichern (für Endstände & Verläufe)
      - name: State committen und pushen
        run: |
          git config --global user.name "JARVIS Bot"
          git config --global user.email "bot@jarvis-betting.local"
          git add pending_soccer.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: soccer live state" && git push)
