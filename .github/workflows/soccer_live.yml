name: JARVIS Soccer Live Ticker & Settlement

on:
  schedule:
    # Läuft an Spielabenden (Mo-Fr sowie Sa/So) von 18:00 bis 23:00 Uhr alle 10 Minuten
    - cron: '*/10 18-23 * * *'
  workflow_dispatch: # Erlaubt jederzeit einen manuellen Start per Klick

jobs:
  track-and-settle:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          pip install requests

      # Prüfen & Live-Updates an Telegram senden
      - name: Live-Ticker ausführen
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_SOCCER: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: |
          python soccer_live.py

      # Aktualisierten State & Ergebnisse ins Repo sichern
      - name: State ins Repo committen
        run: |
          git config --global user.name "JARVIS Bot"
          git config --global user.email "bot@jarvis-betting.local"
          git add pending_soccer.json history_soccer.csv || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "Keine Änderungen zum Committen."
          else
            git commit -m "Auto: Update live scores & ticket settlement [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
