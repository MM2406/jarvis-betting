name: JARVIS NFL Settle

on:
  schedule:
    # 06:45 UTC = 07:45 Uhr MEZ
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settle-nfl:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NFL Settle ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_US_THREAD_ID: ${{ secrets.TELEGRAM_US_THREAD_ID }}
        run: python settle_nfl.py

      - name: Pending NFL committen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nfl.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update settled NFL bets [skip ci]" && git push)
