name: settle-nfl

on:
  schedule:
    # Jeden Morgen um 06:45 UTC (= 07:45 Uhr MEZ)
    - cron: '45 6 * * *'
  workflow_dispatch:

concurrency:
  group: settle-nfl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle-nfl:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NFL Abrechnung ausfuehren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NFL_THREAD_ID: ${{ secrets.TELEGRAM_NFL_THREAD_ID }}
          TELEGRAM_THREAD_NFL: ${{ secrets.TELEGRAM_THREAD_NFL }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NFL }}
        run: python settle_nfl.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nfl.json nfl_history.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an pending_nfl.json oder nfl_history.json vorhanden."
          else
            git commit -m "Update NFL settlement and history [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
