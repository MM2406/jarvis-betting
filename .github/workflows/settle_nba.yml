name: Settle NBA Bets

on:
  schedule:
    # Täglich um 09:30 UTC nach Ende aller Westküsten-Spiele
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  settle-nba:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests

      - name: NBA Wetten abrechnen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NBA }}
        run: python settle_nba.py

      - name: Pending-Datei entfernen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f pending_nba.json ]; then
            git add -A
            git commit -m "Remove settled pending_nba.json [skip ci]" || echo "No changes to commit"
            git pull --rebase origin main
            git push origin main
          fi
