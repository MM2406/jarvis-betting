name: JARVIS Settle NBA

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settle-nba:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NBA Abrechnung ausfuehren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_NBA: ${{ secrets.TELEGRAM_THREAD_NBA }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NBA }}
        run: python settle_nba.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nba.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NBA settled history [skip ci]" && git pull --rebase origin main && git push origin main)
