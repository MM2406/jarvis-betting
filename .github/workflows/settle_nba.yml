name: settle-nba

on:
  schedule:
    # Täglich um 06:45 UTC (= 07:45 Uhr MEZ) zur Abrechnung der NBA-Nachtspiele
    - cron: '45 6 * * *'
  workflow_dispatch:

concurrency:
  group: settle-nba
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle-nba:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NBA Abrechnung ausfuehren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NBA_THREAD_ID: ${{ secrets.TELEGRAM_NBA_THREAD_ID }}
          TELEGRAM_THREAD_NBA: ${{ secrets.TELEGRAM_THREAD_NBA }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NBA }}
        run: python settle_nba.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nba_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Aenderungen an nba_history.json zu committen."
          else
            git commit -m "Update NBA history [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
