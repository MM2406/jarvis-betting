name: JARVIS Darts Intel & Settlement

on:
  schedule:
    # 1. MORGEN-SETTLE: 06:45 UTC (= 07:45 MEZ) - Abrechnung der Vortages-Sessions
    - cron: '45 6 * * *'
    # 2. MITTAGS-RUN: 11:45 UTC (= 12:45 MEZ) - Nachmittags-Sessions (PDC / Players Champs)
    - cron: '45 11 * * *'
    # 3. ABEND-RUN: 16:45 UTC (= 17:45 MEZ) - Abendsessions (ab 20:00 Uhr)
    - cron: '45 16 * * *'
  workflow_dispatch:

concurrency:
  group: darts-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-darts:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Darts Intel ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DARTS_THREAD_ID: ${{ secrets.TELEGRAM_DARTS_THREAD_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_DARTS_THREAD_ID }}
        run: python darts_intel.py

      - name: State & History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add darts_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an darts_history.json vorhanden."
          else
            git commit -m "Auto-Update: darts_history.json [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
