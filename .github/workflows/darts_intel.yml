name: darts-intel

on:
  schedule:
    # 09:00 UTC (= 10:00 Uhr MEZ) und 16:00 UTC (= 17:00 Uhr MEZ)
    - cron: '0 9,16 * * *'
  workflow_dispatch:

concurrency:
  group: darts-intel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-darts-intel:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Darts Intel ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DARTS_THREAD_ID: ${{ secrets.TELEGRAM_DARTS_THREAD_ID }}
          TELEGRAM_THREAD_DARTS: ${{ secrets.TELEGRAM_THREAD_DARTS }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_DARTS }}
        run: python darts_intel.py

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add darts_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Aenderungen an darts_history.json vorhanden."
          else
            git commit -m "Update Darts History [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
