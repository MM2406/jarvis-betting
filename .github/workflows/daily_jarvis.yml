name: Soccer Betting Jarvis

on:
  schedule:
    # 1. MORGEN-RUN: 08:30 UTC (= 10:30 Uhr MESZ / 09:30 Uhr MEZ)
    - cron: '30 8 * * *'

    # 2. VORABEND-RUN: 14:30 UTC (= 16:30 Uhr MESZ / 15:30 Uhr MEZ)
    - cron: '30 14 * * *'

  workflow_dispatch: # Manueller Start-Button

jobs:
  run-soccer-jarvis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests google-genai

      - name: Soccer Jarvis starten
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: python jarvis.py

      - name: Save pending bets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_soccer.json || true
          git commit -m "Save pending soccer bets [skip ci]" || exit 0
          git push
