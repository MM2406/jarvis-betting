name: Daily Betting Jarvis

on:
  schedule:
    # Montag bis Donnerstag: Morgens um 07:30 UTC (= 09:30 Uhr MESZ)
    - cron: '30 7 * * 1-4'
    
    # Freitag, Samstag, Sonntag: Mittag-Dossier um 10:30 UTC (= 12:30 Uhr MESZ)
    - cron: '30 10 * * 5,6,0'
    
    # Freitag, Samstag, Sonntag: Abend-Dossier um 15:15 UTC (= 17:15 Uhr MESZ, perfekt vor 18:30 Uhr)
    - cron: '15 15 * * 5,6,0'

  workflow_dispatch: # Manueller Test-Button bleibt erhalten

jobs:
  run-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests google-genai

      - name: Jarvis starten
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jarvis.py
