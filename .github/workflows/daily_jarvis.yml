name: JARVIS Daily Soccer Intel

on:
  schedule:
    # 1. MITTAGS-EDITION: 10:30 UTC (= 11:30 Uhr MEZ)
    - cron: '30 10 * * *'
    # 2. ABEND-EDITION: 15:30 UTC (= 16:30 Uhr MEZ)
    - cron: '30 15 * * *'
  workflow_dispatch:

concurrency:
  group: daily-soccer-intel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-soccer-intel:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: JARVIS Soccer Intel ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_SOCCER: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: python jarvis.py

      - name: Pending Picks committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_soccer.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Aenderungen an pending_soccer.json vorhanden."
          else
            git commit -m "Update pending soccer bets [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
