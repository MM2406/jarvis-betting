name: Soccer Betting Jarvis

on:
  schedule:
    # 1. MORGEN-RUN: 08:30 UTC (= 10:30 Uhr MESZ / 09:30 Uhr MEZ)
    # Perfekter Überblick über den gesamten Spieltag nach den Pressekonferenzen
    - cron: '30 8 * * *'

    # 2. VORABEND-RUN: 14:30 UTC (= 16:30 Uhr MESZ / 15:30 Uhr MEZ)
    # Frische Quoten vor den Abendspielen (Freitagabend, Bundesliga 18:30, Top-Ligen & Champions League)
    - cron: '30 14 * * *'

  workflow_dispatch: # Manueller Start-Button

jobs:
  run-soccer-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests google-genai

      - name: Soccer Jarvis starten
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jarvis.py
