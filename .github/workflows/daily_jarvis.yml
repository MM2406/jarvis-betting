name: JARVIS Soccer Intel

on:
  schedule:
    # 1. MORGEN-SETTLE: 06:45 UTC (= 07:45 MEZ)
    - cron: '45 6 * * *'
    # 2. MITTAGS-PICKS: 10:15 UTC (= 11:15 MEZ)
    - cron: '15 10 * * *'
    # 3. ABEND-PICKS: 15:45 UTC (= 16:45 MEZ)
    - cron: '45 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-soccer-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Soccer Jarvis ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_SOCCER: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: python jarvis.py

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add soccer_history.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Soccer history [skip ci]" && git pull --rebase origin main && git push)
