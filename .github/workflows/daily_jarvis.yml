name: Daily Betting Jarvis

on:
  schedule:
    # 1. Vormittags-Dossier (Jeden Tag): 08:30 UTC (= 10:30 Uhr MESZ)
    - cron: '30 8 * * *'

    # 2. Prime-Time Abend-Dossier (Jeden Tag): 15:30 UTC (= 17:30 Uhr MESZ, ideal vor 18:45 Uhr Europacup & US-Nacht)
    - cron: '30 15 * * *'

  workflow_dispatch: # Manueller Test-Button bleibt erhalten

jobs:
  run-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests google-genai

      - name: Jarvis starten
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jarvis.py
