name: Daily Betting Jarvis

on:
  schedule:
    # Montag bis Freitag: Einmal täglich morgens um 07:30 Uhr UTC (08:30 Uhr MEZ)
    - cron: '30 7 * * 1-5'
    
    # Samstag und Sonntag: Bericht 1 um 11:30 Uhr UTC (= 12:30 Uhr MEZ für die 13:30-Spiele wie 2. Bundesliga)
    - cron: '30 11 * * 6,0'
    
    # Samstag und Sonntag: Bericht 2 um 17:00 Uhr UTC (= 18:00 Uhr MEZ für Abendspiele, NFL, MLS etc.)
    - cron: '0 17 * * 6,0'

  workflow_dispatch: # Manueller Test-Button bleibt erhalten

jobs:
  run-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests google-genai

      - name: Jarvis starten
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jarvis.py
