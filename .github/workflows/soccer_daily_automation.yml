name: JARVIS Soccer Daily Full Automation

on:
  schedule:
    # Läuft jeden Tag automatisch um 11:00 Uhr UTC (12:00 Uhr MEZ)
    - cron: '0 11 * * *'
  workflow_dispatch: # Erlaubt optional weiterhin einen manuellen Start, falls nötig

jobs:
  run-daily-intel:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 1. Tägliche Analyse aus SQLite-Datenbank berechnen & Briefing erstellen
      - name: Quant-Analyse berechnen & Content generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_SOCCER: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: |
          python generate_daily_intel.py

      # 2. Notfall-Filter: Blockiert sofort bei ungültigen Daten, Player Props oder falschen Quoten
      - name: Sanity Check gegen Falschdaten & Player Props
        run: |
          python validate_soccer_ticket.py

      # 3. Wenn Validierung bestanden: An Telegram senden
      - name: Telegram Post absenden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_SOCCER: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: |
          python -c "
          import json, os, requests
          with open('pending_soccer.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          thread_id = os.environ.get('TELEGRAM_THREAD_SOCCER')
          text = data.get('original_text', '')
          if token and chat_id and text:
              url = f'https://api.telegram.org/bot{token}/sendMessage'
              payload = {
                  'chat_id': chat_id,
                  'text': text,
                  'parse_mode': 'HTML',
                  'disable_web_page_preview': True
              }
              if thread_id:
                  payload['message_thread_id'] = int(thread_id)
              res = requests.post(url, json=payload, timeout=20)
              if res.status_code == 200:
                  msg_id = res.json().get('result', {}).get('message_id')
                  data['message_id'] = msg_id
                  with open('pending_soccer.json', 'w', encoding='utf-8') as f_out:
                      json.dump(data, f_out, ensure_ascii=False, indent=2)
                  print(f'✅ Telegram Post erfolgreich! message_id: {msg_id}')
              else:
                  print(f'❌ Telegram Fehler: {res.text}')
          "

      # 4. State ins Git sichern (wichtig für den späteren Live-Tracker)
      - name: State ins Repo committen
        run: |
          git config --global user.name "JARVIS Bot"
          git config --global user.email "bot@jarvis-betting.local"
          git add pending_soccer.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Daily soccer intel dispatched [skip ci]" && git push)
