name: JARVIS NFL Intel

on:
  schedule:
    # 1. MORGEN-SETTLE: 06:45 UTC (= 07:45 MEZ)
    - cron: '45 6 * * *'
    # 2. DONNERSTAG: Thursday Night Football (16:45 UTC = 17:45 MEZ)
    - cron: '45 16 * * 4'
    # 3. SONNTAG: Early Slate & Main Slate (16:00 UTC = 17:00 MEZ)
    - cron: '0 16 * * 0'
    # 4. MONTAG: Monday Night Football (17:45 UTC = 18:45 MEZ)
    - cron: '45 17 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nfl-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NFL Jarvis ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NFL || secrets.TELEGRAM_US_THREAD_ID }}
          TELEGRAM_US_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NFL || secrets.TELEGRAM_US_THREAD_ID }}
          TELEGRAM_THREAD_NFL: ${{ secrets.TELEGRAM_THREAD_NFL || secrets.TELEGRAM_US_THREAD_ID }}
        run: python nfl_jarvis.py

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nfl.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NFL pending bets [skip ci]" && git pull --rebase origin main && git push)
