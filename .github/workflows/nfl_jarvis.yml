name: JARVIS NFL Intel

on:
  schedule:
    # 1. MORGEN-SETTLE (nur Di & Fr nach Primetime-Spielen): 06:45 UTC (= 07:45 MEZ)
    - cron: '45 6 * * 2,5'
    # 2. DONNERSTAG (Thursday Night Football): 16:00 UTC (= 17:00 MEZ)
    - cron: '0 16 * * 4'
    # 3. SONNTAG (Haupt-Spieltag Slate): 15:30 UTC (= 16:30 MEZ)
    - cron: '30 15 * * 0'
    # 4. MONTAG (Monday Night Football): 17:00 UTC (= 18:00 MEZ)
    - cron: '0 17 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nfl-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NFL Jarvis ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_NFL: ${{ secrets.TELEGRAM_THREAD_NFL }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NFL }}
        # Exakter Dateiname aus deinem Repository:
        run: python jarvis_nfl.py

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nfl.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NFL pending picks [skip ci]" && git pull --rebase origin main && git push origin main)
