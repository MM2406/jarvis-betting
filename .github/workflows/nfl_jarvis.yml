name: JARVIS NFL Intel

on:
  schedule:
    # 1. MORGEN-SETTLE (Täglich): 06:45 UTC (= 07:45 MEZ) - Reine Abrechnung!
    - cron: '45 6 * * *'
    # 2. DONNERSTAG (Thursday Night Football): 16:00 UTC (= 17:00 MEZ)
    - cron: '0 16 * * 4'
    # 3. SONNTAG (Haupt-Spieltag Slate): 15:30 UTC (= 16:30 MEZ)
    - cron: '30 15 * * 0'
    # 4. MONTAG (Monday Night Football): 17:00 UTC (= 18:00 MEZ)
    - cron: '0 17 * * 1'
  workflow_dispatch:
    inputs:
      settle_only:
        description: 'Nur Abrechnung durchfuehren (True/False)'
        required: false
        default: 'false'

concurrency:
  group: nfl-intel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-nfl-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NFL Jarvis ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_NFL: ${{ secrets.TELEGRAM_THREAD_NFL }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NFL }}
        run: |
          # Wenn der Workflow um 06:45 UTC getriggert wird, nur Abrechnung laufen lassen
          if [ "${{ github.event.schedule }}" = "45 6 * * *" ] || [ "${{ github.event.inputs.settle_only }}" = "true" ]; then
            echo "Führe reinen Morgen-Settlement-Lauf aus..."
            python jarvis_nfl.py --settle-only
          else
            echo "Führe regulären NFL-Lauf (Settlement + Dossier) aus..."
            python jarvis_nfl.py
          fi

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nfl.json 2>/dev/null || true
          git add nfl_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Aenderungen an den NFL-Dateien vorhanden."
          else
            git commit -m "Update NFL pending picks and history [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
