name: NFL Betting Jarvis

on:
  schedule:
    # Donnerstag (TNF): 17:00 UTC
    - cron: '0 17 * * 4'
    # Sonntag Early Slate (19:00 Uhr Kickoffs): 15:30 UTC
    - cron: '30 15 * * 0'
    # Sonntag Late Slate (22:05/22:25 Uhr & Sunday Night): 18:45 UTC
    - cron: '45 18 * * 0'
    # Montag (MNF): 17:00 UTC
    - cron: '0 17 * * 1'
  workflow_dispatch:

jobs:
  run-nfl-jarvis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests

      - name: NFL Jarvis starten
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NFL }}
        run: python jarvis_nfl.py

      - name: Save pending NFL bets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nfl.json || true
          git commit -m "Save pending NFL bets [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
