name: JARVIS Performance & Analytics Recaps

on:
  schedule:
    # Wöchentlicher Recap jeden Montag um 06:00 Uhr UTC
    - cron: '0 6 * * 1'
    # Monatlicher Recap am 1. jedes Monats um 07:00 Uhr UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Zeitraum für den Report (weekly oder monthly)'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          pip install requests matplotlib

      - name: Analytics Recap generieren und senden
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ANALYTICS_THREAD_ID: "134"
        run: |
          TIMEFRAME="${{ github.event.inputs.timeframe }}"
          if [ -z "$TIMEFRAME" ]; then
            if [ "$(date +%d)" = "01" ]; then
              TIMEFRAME="monthly"
            else
              TIMEFRAME="weekly"
            fi
          fi
          python analytics_engine.py $TIMEFRAME
