name: JARVIS Performance & Analytics Recaps

on:
  schedule:
    # 1. Wöchentlicher Recap jeden Montag um 07:15 UTC (= 08:15 Uhr MEZ)
    # (Sicherer 30-Minuten-Puffer nach den 06:45-UTC-Abrechnungen der Sonntagnacht-Spiele)
    - cron: '15 7 * * 1'
    # 2. Monatlicher Recap am 1. jedes Monats um 07:15 UTC (= 08:15 Uhr MEZ)
    - cron: '15 7 1 * *'
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Zeitraum für den Report (weekly oder monthly)'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly

concurrency:
  group: analytics-engine
  cancel-in-progress: false

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Analytics Recap generieren und senden
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ANALYTICS_THREAD_ID: ${{ secrets.TELEGRAM_ANALYTICS_THREAD_ID }}
          TELEGRAM_THREAD_ANALYTICS: ${{ secrets.TELEGRAM_ANALYTICS_THREAD_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_ANALYTICS_THREAD_ID }}
        run: |
          TIMEFRAME="${{ github.event.inputs.timeframe }}"
          if [ -z "$TIMEFRAME" ]; then
            if [ "$(date +%d)" = "01" ]; then
              TIMEFRAME="monthly"
            else
              TIMEFRAME="weekly"
            fi
          fi
          python analytics_engine.py $TIMEFRAME
