name: JARVIS Mixed & Multi-Acca Intel

on:
  schedule:
    # 1. MORGEN-SETTLE: 06:45 UTC (= 07:45 MEZ) - Abrechnung der Vortages-Kombis
    - cron: '45 6 * * *'
    # 2. SAMSTAG & SONNTAG: Nachmittags-Slate um 12:15 UTC (= 13:15 MEZ)
    - cron: '15 12 * * 6,0'
    # 3. TÄGLICHER HAUPT-RUN: Abends um 16:15 UTC (= 17:15 MEZ)
    - cron: '15 16 * * *'
  workflow_dispatch:

concurrency:
  group: mixed-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-mixed:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Mixed Intel ausfuehren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MIXED_THREAD_ID: ${{ secrets.TELEGRAM_MIXED_THREAD_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_MIXED_THREAD_ID }}
        run: python mixed_intel.py

      - name: State & History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mixed_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an mixed_history.json vorhanden."
          else
            git commit -m "Auto-Update: mixed_history.json [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
