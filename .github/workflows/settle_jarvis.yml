name: JARVIS Settle Soccer

on:
  schedule:
    # Jeden Morgen um 06:45 UTC (= 07:45 Uhr MEZ)
    - cron: '45 6 * * *'
  workflow_dispatch:

concurrency:
  group: settle-soccer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle-soccer:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Soccer Abrechnung ausfuehren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_SOCCER: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: python settle_soccer.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_soccer.json 2>/dev/null || true
          git add soccer_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Aenderungen an den Soccer-Dateien vorhanden."
          else
            git commit -m "Update Soccer settled history [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
