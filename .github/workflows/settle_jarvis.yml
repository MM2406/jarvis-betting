name: Settle Jarvis Soccer

on:
  schedule:
    - cron: '0 8 * * *'  # Täglich morgens um 08:00 UTC
  workflow_dispatch:

jobs:
  run-settlement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Soccer Settlement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_SOCCER }}
        run: |
          python settle_soccer.py

      - name: Commit & Push (Remove Pending File)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          if [ ! -f pending_soccer.json ]; then
            git add -A
            git commit -m "Remove settled pending_soccer.json [skip ci]" || echo "No changes to commit"
            git push
          fi
