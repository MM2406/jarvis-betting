name: JARVIS Tennis Intel & Settlement

on:
  schedule:
    # 09:30 Uhr MEZ (08:30 UTC): Europa-/Tages-Slate & Abrechnung der Nachtmatches
    - cron: '30 8 * * *'
    # 17:30 Uhr MEZ (16:30 UTC): Übersee-/Abend-Slate & Abrechnung der Tagesmatches
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  run-tennis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tennis Engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TENNIS_THREAD_ID: ${{ secrets.TELEGRAM_TENNIS_THREAD_ID }}
        run: python tennis.py

      - name: Commit & Push History Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_history.json || true
          git commit -m "Auto-Update: tennis_history.json [skip ci]" || true
          git push || true
