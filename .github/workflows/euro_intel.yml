name: JARVIS Euro-Hoops & Ice Intel

on:
  schedule:
    # 1. MORGEN-SETTLE: 06:45 UTC (= 07:45 Uhr MEZ)
    - cron: '45 6 * * *'
    # 2. PICKS: 14:45 UTC (= 15:45 Uhr MEZ) -> Puffer fuer DEL (16:30 Uhr) und fruehe EuroLeague (18:30 Uhr)
    - cron: '45 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-euro-intel:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Euro Intel ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_EURO_THREAD_ID || secrets.TELEGRAM_THREAD_EURO }}
          TELEGRAM_EURO_THREAD_ID: ${{ secrets.TELEGRAM_EURO_THREAD_ID || secrets.TELEGRAM_THREAD_EURO }}
        run: python euro_intel.py

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add euro_history.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update euro history [skip ci]" && git pull --rebase origin main && git push)
