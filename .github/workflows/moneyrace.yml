name: JARVIS Moneyrace

on:
  schedule:
    # 1. TÄGLICHE MORGEN-ABRECHNUNG: 06:45 UTC (= 07:45 Uhr MEZ)
    - cron: '45 6 * * *'
    
    # 2. WOCHENENDE (Samstag & Sonntag):
    # Run 1 (Mittag): 10:45 UTC (= 11:45 Uhr MEZ) -> Puffer für 13:00 / 15:15 / 15:30 Uhr
    - cron: '45 10 * * 6,0'
    # Run 2 (Abend - Primär): 16:45 UTC (= 17:45 Uhr MEZ) -> Settle Run 1 + Pick für Abend
    - cron: '45 16 * * 6,0'
    # Run 3 (Abend - Backup): 17:45 UTC (= 18:45 Uhr MEZ) -> Falls Run 1 um 17:45 noch live war
    - cron: '45 17 * * 6,0'
    
    # 3. MONTAG BIS FREITAG:
    # Run um 16:45 UTC (= 17:45 Uhr MEZ) für Flutlicht & Topspiele
    - cron: '45 16 * * 1-5'

  workflow_dispatch:

concurrency:
  group: moneyrace-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-moneyrace:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Moneyrace ausführen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MONEYRACE_THREAD_ID: ${{ secrets.TELEGRAM_MONEYRACE_THREAD_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_MONEYRACE_THREAD_ID }}
        run: python moneyrace.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add moneyrace_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Änderungen an moneyrace_state.json vorhanden."
          else
            git commit -m "Update Moneyrace state [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
