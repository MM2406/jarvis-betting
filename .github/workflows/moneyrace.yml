name: JARVIS Moneyrace

on:
  schedule:
    # Täglich um 08:00 UTC (09:00 Uhr MEZ) zum Auswerten von Nachtspielen
    - cron: '0 8 * * *'
    # Täglich um 14:00 UTC (15:00 Uhr MEZ) zur Pick-Auswahl für den Abend
    - cron: '0 14 * * *'
  workflow_dispatch: # Ermöglicht manuelles Starten per Klick

permissions:
  contents: write

jobs:
  run-moneyrace:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Moneyrace ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MONEYRACE_THREAD_ID: ${{ secrets.TELEGRAM_MONEYRACE_THREAD_ID }}
        run: python moneyrace.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add moneyrace_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update moneyrace state [skip ci]" && git push)
