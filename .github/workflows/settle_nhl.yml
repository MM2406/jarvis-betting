name: settle-nhl

on:
  schedule:
    # Täglich um 09:00 UTC (10:00 Uhr MEZ) zur Abrechnung der NHL-Nachtspiele
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: settle-nhl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle-nhl:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NHL Abrechnung ausfuehren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NHL_THREAD_ID: ${{ secrets.TELEGRAM_NHL_THREAD_ID }}
          TELEGRAM_THREAD_NHL: ${{ secrets.TELEGRAM_THREAD_NHL }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NHL }}
        run: python settle_nhl.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nhl_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Aenderungen an nhl_history.json zu committen."
          else
            git commit -m "Update NHL history [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
