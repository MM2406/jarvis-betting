name: NBA Betting Jarvis

on:
  schedule:
    # Mo-Fr: 19:30 UTC (= 20:30 MEZ)
    - cron: '30 19 * * 1-5'
    # Sa & So: Early Slate (15:30 UTC = 16:30 MEZ) & Nacht-Slate (19:30 UTC = 20:30 MEZ)
    - cron: '30 15 * * 6'
    - cron: '30 19 * * 6'
    - cron: '30 15 * * 0'
    - cron: '30 19 * * 0'
  workflow_dispatch:

jobs:
  run-nba-jarvis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests

      - name: NBA Jarvis starten
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NBA || secrets.TELEGRAM_US_THREAD_ID }}
          TELEGRAM_US_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NBA || secrets.TELEGRAM_US_THREAD_ID }}
          TELEGRAM_THREAD_NBA: ${{ secrets.TELEGRAM_THREAD_NBA || secrets.TELEGRAM_US_THREAD_ID }}
        run: python jarvis_nba.py

      - name: Save pending NBA bets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nba.json || true
          git commit -m "Save pending NBA bets [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
