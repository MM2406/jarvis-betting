name: JARVIS NBA Intel & Daily Picks

on:
  schedule:
    # 1. MORGEN-SETTLE (Täglich um 06:45 UTC = 07:45 Uhr MEZ): Nachtspiele abrechnen
    - cron: '45 6 * * *'

    # 2. WOCHENENDE-PICKS (Samstag & Sonntag um 16:30 UTC = 17:30 Uhr MEZ): Frühe Tip-offs
    - cron: '30 16 * * 6,0'

    # 3. WOCHENTAGS-PICKS (Montag bis Freitag um 20:15 UTC = 21:15 Uhr MEZ): Nacht-Slate
    - cron: '15 20 * * 1-5'

  workflow_dispatch:

concurrency:
  group: nba-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-nba:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: JARVIS NBA Engine ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_NBA: ${{ secrets.TELEGRAM_THREAD_NBA }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NBA }}
        run: python jarvis_nba.py

      - name: State & History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nba.json 2>/dev/null || true
          git add nba_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an NBA-Dateien vorhanden."
          else
            git commit -m "Update NBA pending and history [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
