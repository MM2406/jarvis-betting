name: JARVIS NBA Intel

on:
  schedule:
    # 1. MORGEN-SETTLE (Täglich): 06:45 UTC (= 07:45 Uhr MEZ) - Alle Nachtspiele abrechnen
    - cron: '45 6 * * *'

    # 2. WOCHENENDE-PICKS (Samstag & Sonntag): 16:30 UTC (= 17:30 Uhr MEZ) - Rechtzeitig vor frühen Tip-offs (ab 19:00 / 21:30 Uhr MEZ)
    - cron: '30 16 * * 6,0'

    # 3. WOCHENTAGS-PICKS (Montag bis Freitag): 21:00 UTC (= 22:00 Uhr MEZ) - Aktuelle Injury Reports & finale Lineups für die Nacht
    - cron: '0 21 * * 1-5'

  workflow_dispatch:

concurrency:
  group: daily-nba-intel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-nba-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NBA Jarvis ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_NBA: ${{ secrets.TELEGRAM_THREAD_NBA }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NBA }}
        run: python jarvis_nba.py

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nba.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Aenderungen an pending_nba.json vorhanden."
          else
            git commit -m "Update NBA pending picks [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
