name: JARVIS NHL Intel & Daily Picks

on:
  schedule:
    # 1. MORGEN-SETTLE (Täglich um 06:45 UTC = 07:45 MEZ): Nachtspiele abrechnen
    - cron: '45 6 * * *'

    # 2. WOCHENENDE-PICKS (Sa & So um 15:00 UTC = 16:00 MEZ): Vorlauf für frühe Matinee-Spiele
    - cron: '0 15 * * 6,0'

    # 3. WOCHENTAGS-PICKS (Mo - Fr um 20:15 UTC = 21:15 MEZ): Bestätigte Goalies & Nacht-Slate
    - cron: '15 20 * * 1-5'

  workflow_dispatch:

concurrency:
  group: nhl-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-nhl:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: JARVIS NHL Engine ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_NHL: ${{ secrets.TELEGRAM_THREAD_NHL }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NHL }}
        run: python jarvis_nhl.py

      - name: State & History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nhl.json 2>/dev/null || true
          git add nhl_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an den NHL-Dateien vorhanden."
          else
            git commit -m "Update NHL pending and history [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
