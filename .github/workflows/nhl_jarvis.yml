name: JARVIS NHL Intel & Daily Picks

on:
  schedule:
    # 1. MORGEN-SETTLE (Täglich um 06:45 UTC = 07:45 MEZ - wertet Nachtspiele aus)
    - cron: '45 6 * * *'
    # 2. ABEND-ANALYSE (Täglich um 16:45 UTC = 17:45 MEZ - Picks vor Spielbeginn)
    - cron: '45 16 * * *'

  workflow_dispatch:
    inputs:
      settle_only:
        description: 'Nur Abrechnung durchfuehren (true/false)'
        required: false
        default: 'false'

concurrency:
  group: nhl-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-nhl:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: JARVIS NHL Engine ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_NHL: ${{ secrets.TELEGRAM_THREAD_NHL }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NHL }}
        run: |
          if [ "${{ github.event.schedule }}" = "45 6 * * *" ] || [ "${{ github.event.inputs.settle_only }}" = "true" ]; then
            echo "Führe reinen Morgen-Settlement-Lauf aus..."
            python jarvis_nhl.py --settle-only
          else
            echo "Führe regulären NHL-Lauf (Settlement + Dossier) aus..."
            python jarvis_nhl.py
          fi

      - name: State & History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nhl.json 2>/dev/null || true
          git add nhl_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an den NHL-Dateien vorhanden."
          else
            git commit -m "Update NHL pending and history [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 3
            done
          fi
