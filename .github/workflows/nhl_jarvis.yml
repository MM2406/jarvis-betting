name: NHL Betting Jarvis

on:
  schedule:
    # Montag bis Freitag: 19:30 UTC
    - cron: '30 19 * * 1-5'
    # Samstag: Early Slate (15:30 UTC) & Nacht-Slate (19:30 UTC)
    - cron: '30 15 * * 6'
    - cron: '30 19 * * 6'
    # Sonntag: Early Slate (15:30 UTC) & Nacht-Slate (19:30 UTC)
    - cron: '30 15 * * 0'
    - cron: '30 19 * * 0'
  workflow_dispatch:

jobs:
  run-nhl-jarvis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests

      - name: NHL Jarvis starten
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NHL }}
        run: python jarvis_nhl.py

      - name: Save pending NHL bets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nhl.json || true
          git commit -m "Save pending NHL bets [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
