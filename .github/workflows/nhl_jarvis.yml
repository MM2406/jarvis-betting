name: JARVIS NHL Intel

on:
  schedule:
    # 1. MORGEN-SETTLE: 06:45 UTC (= 07:45 MEZ)
    - cron: '45 6 * * *'
    # 2. WOCHENENDE-PICKS (Sa & So): 15:00 UTC (= 16:00 MEZ) fuer fruehe Spiele
    - cron: '0 15 * * 6,0'
    # 3. WOCHENTAGS-PICKS (Mo - Fr): 17:00 UTC (= 18:00 MEZ) fuer die Nacht-Slate
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nhl-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: NHL Jarvis ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_NHL: ${{ secrets.TELEGRAM_THREAD_NHL }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_NHL }}
        run: python jarvis_nhl.py

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_nhl.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update NHL pending picks [skip ci]" && git pull --rebase origin main && git push)
