name: moneyrace-live

on:
  schedule:
    # Laeuft tagsueber alle 15 Minuten (11:00 bis 23:45 UTC = 12:00 bis 00:45 Uhr MEZ)
    - cron: '*/15 11-23 * * *'
  workflow_dispatch:

concurrency:
  group: moneyrace-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-live-board:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Live-Update ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MONEYRACE_THREAD_ID: ${{ secrets.TELEGRAM_MONEYRACE_THREAD_ID }}
          TELEGRAM_THREAD_MONEYRACE: ${{ secrets.TELEGRAM_THREAD_MONEYRACE }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_MONEYRACE }}
        run: python moneyrace_live.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add moneyrace_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine relevanten Aenderungen zu committen."
          else
            git commit -m "Update Live Board State [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
