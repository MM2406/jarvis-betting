name: JARVIS Moneyrace Live Board

on:
  schedule:
    # 1. Haupt-Fenster (täglich): 12:00 bis 23:59 UTC alle 15 Minuten (Europa-Nachmittag & Primetime)
    - cron: '*/15 12-23 * * *'
    # 2. US-Late-Night-Fenster (täglich): 00:00 bis 04:00 UTC alle 15 Minuten (NBA/NHL-Nachtspiele)
    - cron: '*/15 0-4 * * *'
    # 3. Morgen-Sicherheitsnetz (täglich): 06:00 und 08:00 UTC zur finalen Abrechnung
    - cron: '0 6,8 * * *'
  workflow_dispatch:

concurrency:
  group: moneyrace-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-live-board:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests

      - name: Live-Update ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MONEYRACE_THREAD_ID: ${{ secrets.TELEGRAM_MONEYRACE_THREAD_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_MONEYRACE_THREAD_ID }}
        run: python moneyrace_live.py

      - name: State committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add moneyrace_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live board state [skip ci]" && git pull --rebase origin main && git push origin main)
