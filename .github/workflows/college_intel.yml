name: JARVIS US College Intel & Settlement

on:
  schedule:
    # 1. MORGEN-SETTLE: 06:45 UTC (= 07:45 MEZ)
    - cron: '45 6 * * *'
    # 2. SAMSTAG/SONNTAG: Große Slates (15:00 UTC = 16:00 MEZ)
    - cron: '0 15 * * 6,0'
    # 3. DIENSTAG-FREITAG: Midweek Hoops (17:00 UTC = 18:00 MEZ)
    - cron: '0 17 * * 2-5'
  workflow_dispatch:

concurrency:
  group: college-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-college:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: College Intel ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COLLEGE_THREAD_ID: ${{ secrets.TELEGRAM_COLLEGE_THREAD_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_COLLEGE_THREAD_ID }}
        run: python college_intel.py

      - name: State & History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add college_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an college_history.json vorhanden."
          else
            git commit -m "Auto-Update: college_history.json [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push origin main
          fi
