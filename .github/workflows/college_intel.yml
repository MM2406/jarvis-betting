name: JARVIS US College Intel

on:
  schedule:
    # 1. MORGEN-SETTLE: 06:45 UTC (= 07:45 Uhr MEZ)
    - cron: '45 6 * * *'
    # 2. SAMSTAG/SONNTAG: Grosse Slates (15:00 UTC = 16:00 Uhr MEZ)
    - cron: '0 15 * * 6,0'
    # 3. DIENSTAG-FREITAG: Midweek Hoops (17:00 UTC = 18:00 Uhr MEZ)
    - cron: '0 17 * * 2-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-college-intel:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: College Intel ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COLLEGE_THREAD_ID: ${{ secrets.TELEGRAM_COLLEGE_THREAD_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_COLLEGE_THREAD_ID }}
        run: python college_intel.py

      - name: History committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add college_history.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update college history [skip ci]" && git pull --rebase origin main && git push origin main)
